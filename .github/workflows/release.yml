name: release
on:
  push: { tags: ["v*"] }
  # Rebuilds and re-uploads an existing tag's packages with the workflow as it
  # is on the dispatching branch, since a rerun of the tag's own run keeps the
  # workflow file the tag points at.
  workflow_dispatch:
    inputs:
      tag: { description: "Existing v* tag", required: true }
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  arch:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git github-cli sudo
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: .
          su builder -c "packaging/arch/build.sh --tag $TAG --syncdeps --noconfirm"
      # The staged PKGBUILD, .SRCINFO and install scripts are the AUR
      # submission for this tag, checksums pinned.
      - run: |
          cd packaging/arch/build
          tar czf "formalshell-aur-$TAG.tar.gz" PKGBUILD .SRCINFO *.install
          gh release upload "$TAG" --clobber *.pkg.tar.zst "formalshell-aur-$TAG.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
  debian:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:trixie", suite: trixie }
          - { image: "debian:testing", suite: forky }
          - { image: "debian:unstable", suite: sid }
          - { image: "ubuntu:26.04", suite: resolute }
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - run: packaging/debian/build.sh --tag "$TAG" --suite ${{ matrix.suite }} --install-deps
      # gh is not packaged in every suite, so the upload runs on the host.
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}
          path: packaging/debian/build/*.deb
  debian-upload:
    needs: debian
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "debs-*", merge-multiple: true, path: debs }
      # Every file name carries the suite.
      - run: gh release upload "$TAG" --clobber debs/*.deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
