name: release
on:
  push: { tags: ["v*"] }
  # Rebuilds and re-uploads an existing tag's tarballs with the workflow as it
  # is on the dispatching branch, since a rerun of the tag's own run keeps the
  # workflow file the tag points at.
  workflow_dispatch:
    inputs:
      tag: { description: "Existing v* tag", required: true }
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # install.sh downloads formalshell-<arch>-linux.tar.gz from the latest
  # release. dev/tarball.sh builds it on bookworm, the glibc floor.
  tarball:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - run: docker run --rm -v "$PWD:/src" -e VERSION="${TAG#v}" debian:bookworm /src/dev/tarball.sh /src/dist
      - run: gh release upload "$TAG" --clobber dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
