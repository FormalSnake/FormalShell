name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check -L
      - run: nix build -L .#formalshell .#formalshell-greeter
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git namcap sudo
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: .
          su builder -c 'packaging/arch/build.sh --syncdeps --noconfirm'
      - run: namcap packaging/arch/build/PKGBUILD packaging/arch/build/*.pkg.tar.zst
      - run: pacman -U --noconfirm packaging/arch/build/*.pkg.tar.zst
      - name: installed tools run
        run: |
          formalshell-eds --help
          ttfx --version
          tensaku --version
          localsend-cli --help
          omarchy-iphone-bridge --help
          omarchy-iphone-ams --help
          ancs4linux-ctl --help
          clipssh --help
          nothingctl --help
          openscq30 --help
          earbuds --help
      # No shell is running: the client says so and exits 255.
      - run: formalshell-ipc show || [ $? = 255 ]
  debian:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:trixie", suite: trixie }
          - { image: "debian:testing", suite: forky }
          - { image: "debian:unstable", suite: sid }
          - { image: "ubuntu:26.04", suite: resolute }
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git lintian
      - uses: actions/checkout@v4
      - name: dpkg-buildpackage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/debian/build.sh --suite ${{ matrix.suite }} --install-deps
      - run: lintian --fail-on error packaging/debian/build/*.changes
      # Installs every package, runs each tool and checks both fonts reach
      # fontconfig.
      - run: packaging/debian/check.sh packaging/debian/build
