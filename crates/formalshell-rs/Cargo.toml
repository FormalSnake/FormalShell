[package]
name = "formalshell-rs"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
async-channel = "2.5"
async-executor = "1.14"
async-io = "2.6"
async-process = "2"
calloop = "0.14"
chrono = "0.4"
fs-theme = { version = "0.1.0", path = "../fs-theme" }
futures-lite = "2.6"
fs-chrome = { path = "../fs-chrome" }
fs-system = { path = "../fs-system" }
parley = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.44"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
vello_cpu = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys = "6"
inotify = { version = "0.10", default-features = false }

[dev-dependencies]
tempfile = "3"
