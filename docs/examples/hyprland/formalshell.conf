# Window rounding, the blur behind the shell's surfaces and the frame and
# shadow round every window follow the shell's own theme: ThemeEngine
# publishes formalshell-chrome.conf with $rounding (theme.radius), $blur
# (theme.blur) and the theme table's own window chrome ($gapsIn, $gapsOut,
# $borderSize, $borderColor, $shadow, $shadowRange, $shadowPower,
# $shadowOffset, $shadowColor, $shadowInactiveColor), and rewrites it
# whenever any of them changes, so the retro preset squares the corners and
# turns blur off, metamorphosis keeps 10px and blur on, and pantheon casts
# elementary's own shadow under a quiet 1px frame and closes the outer gap it
# has no screen frame to leave room for. The shell never blurs a pixel
# itself.
# Source this from hyprland.conf.
source = ~/.config/hypr/formalshell-chrome.conf

decoration {
    rounding = $rounding
    blur {
        enabled = $blur
        size = 8
        passes = 2
    }
    shadow {
        enabled = $shadow
        range = $shadowRange
        render_power = $shadowPower
        offset = $shadowOffset
        color = $shadowColor
        color_inactive = $shadowInactiveColor
    }
}

# ignore_alpha leaves anything at or below that opacity unblurred, which is
# what keeps the bar strip's empty band between the cells clear. Hyprland
# 0.56 takes layer rules as this named block; the older
# `layerrule = blur, <namespace>` line no longer parses.
#
# The three modal namespaces below take 0.6 instead of 0.2: their layers cover
# the whole output and carry a 0.5 black scrim, which falls under that mark and
# so only darkens the desktop, while the 0.85 card stays over it and keeps its
# blur. A `theme.surfaceOpacity` under 0.6 puts the card under the mark too and
# loses the blur on those three (docs/USAGE.md).
#
# no_anim on every one of them: the shell animates its own surfaces (DESIGN.md
# §1 Motion), so a compositor animation on the layer runs a second one over
# the top of it.
layerrule {
    name = formalshell-bar
    match {
        namespace = formalshell:bar
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

layerrule {
    name = formalshell-frame
    match {
        namespace = formalshell:frame
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

layerrule {
    name = formalshell-panel
    match {
        namespace = formalshell:panel
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

layerrule {
    name = formalshell-menu
    match {
        namespace = formalshell:menu
    }
    blur = $blur
    ignore_alpha = 0.6
    no_anim = true
}

layerrule {
    name = formalshell-notifications-center
    match {
        namespace = formalshell:notifications-center
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

# The OSD pill buds off the bottom line the way a panel buds off the bar's,
# so it is drawn at the same surfaceOpacity the line it grows out of is: one
# silhouette across two windows cannot be opaque on one side of the seam.
layerrule {
    name = formalshell-osd
    match {
        namespace = formalshell:osd
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

# The window switcher's card is drawn at Gala's own 0.6 over the desktop, and
# the rest of its layer is fully transparent, so the 0.2 mark keeps the blur
# under the card and nowhere else. No scrim: the switcher dims nothing.
layerrule {
    name = formalshell-switcher
    match {
        namespace = formalshell:switcher
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

layerrule {
    name = formalshell-tooltip
    match {
        namespace = formalshell:tooltip
    }
    blur = $blur
    ignore_alpha = 0.2
    no_anim = true
}

# The polkit consent card and a plugin's overlay are drawn at the same
# surfaceOpacity every other card is, so they take the same blur, and their
# scrims fall under the 0.6 mark above and darken the desktop instead.
layerrule {
    name = formalshell-polkit
    match {
        namespace = formalshell:polkit
    }
    blur = $blur
    ignore_alpha = 0.6
    no_anim = true
}

layerrule {
    name = formalshell-plugin-overlay
    match {
        namespace = formalshell:plugin-overlay
    }
    blur = $blur
    ignore_alpha = 0.6
    no_anim = true
}

# The surfaces that stay opaque by design (DESIGN.md), so they take the
# animation rule alone with no blur.
layerrule {
    name = formalshell-notifications
    match {
        namespace = formalshell:notifications
    }
    no_anim = true
}

# Window borders track the wallpaper. ThemeEngine rewrites this file on every
# wallpaper and mode change and Hyprland re-reads what it sourced on its own,
# so nothing here needs a reload call. It carries $primary,
# $primaryForeground, $background, $foreground, $border, $destructive and
# $warning, and it exists from the shell's first run even with no wallpaper
# set (the bundled zinc palette renders the same variables).
#
# On a Lua config (Hyprland 0.55+), which cannot source hyprlang, read
# ~/.config/hypr/formalshell-colors.lua instead: the same seven roles as a
# table a `dofile` returns, with the shell calling `hyprctl reload` after each
# write since a dofile'd file is not one Hyprland watches. docs/USAGE.md's
# theming section has the block.
source = ~/.config/hypr/formalshell-colors.conf

# $borderColor is the theme table's own window frame, and it names one of
# this file's colours rather than carrying a copy of it: metamorphosis hangs the
# wallpaper's $primary on the focused window, pantheon the quiet $border on
# every window. hyprlang expands a variable inside another one, so the two
# sourced files can arrive in either order.
# $gapsIn and $gapsOut are the theme's own window spacing: 4 and 8 under
# metamorphosis, 4 and 6 under pantheon, which wears no screen frame and so has
# nothing to leave room for.
general {
    gaps_in = $gapsIn
    gaps_out = $gapsOut
    border_size = $borderSize
    col.active_border = $borderColor
    col.inactive_border = $border
}

group {
    col.border_active = $primary
    col.border_inactive = $border
    col.border_locked_active = $destructive
}

# Replace <store-path> with the installed shell, e.g.
# /nix/store/...-formalshell-0.1. docs/USAGE.md spells the same invocation
# out for every other target.
$fs = qs ipc --any-display -p <store-path>/share/formalshell call

# UTILITIES
bind = SUPER, Space, exec, $fs menu toggle
bind = SUPER ALT, Space, exec, $fs menu summon apps
bind = SUPER CTRL, E, exec, $fs menu summon emoji
bind = SUPER CTRL, C, exec, $fs menu summon capture
bind = SUPER CTRL, O, exec, $fs menu summon toggles
bind = SUPER CTRL, S, exec, $fs menu summon share
bind = SUPER CTRL, R, exec, $fs menu summon reminder
bind = SUPER, Escape, exec, $fs menu summon system
bind = SUPER, K, exec, $fs menu summon keybinds
bind = SUPER CTRL, Q, exec, $fs menu summon calc

# The wallpaper route is the picker grid: pick one and the whole palette
# follows it. There is no "advance to the next wallpaper" IPC verb.
bind = SUPER CTRL, Space, exec, $fs menu summon wallpaper
bind = SUPER SHIFT CTRL, Space, exec, $fs menu summon theme

# Panels by name. `display` is the brightness and output panel, not a bar
# cell of its own.
bind = SUPER CTRL, A, exec, $fs panel toggle audio
bind = SUPER CTRL, B, exec, $fs panel toggle bluetooth
bind = SUPER CTRL, W, exec, $fs panel toggle network
bind = SUPER CTRL, P, exec, $fs panel toggle power
bind = SUPER CTRL, D, exec, $fs panel toggle display
bind = SUPER CTRL ALT, D, exec, $fs panel toggle calendar

# `panel toggleAt n` opens the nth panel-bearing cell of the bar's right
# region, counted from the screen centre outward: with the default layout
# that is power, audio, network, bluetooth, weather. Cells that open no
# panel (tray, bell, indicators) are skipped, and a cell hidden behind a
# collapsed chevron still holds its number.
bind = SUPER CTRL, 1, exec, $fs panel toggleAt 1
bind = SUPER CTRL, 2, exec, $fs panel toggleAt 2
bind = SUPER CTRL, 3, exec, $fs panel toggleAt 3
bind = SUPER CTRL, 4, exec, $fs panel toggleAt 4
bind = SUPER CTRL, 5, exec, $fs panel toggleAt 5
bind = SUPER CTRL, 6, exec, $fs panel toggleAt 6
bind = SUPER CTRL, 7, exec, $fs panel toggleAt 7
bind = SUPER CTRL, 8, exec, $fs panel toggleAt 8
bind = SUPER CTRL, 9, exec, $fs panel toggleAt 9

bind = SUPER, comma, exec, $fs notifications dismissOne
bind = SUPER SHIFT, comma, exec, $fs notifications dismissAll
bind = SUPER ALT, comma, exec, $fs notifications invokeLast
bind = SUPER SHIFT ALT, comma, exec, $fs notifications showHistory
bind = SUPER CTRL, comma, exec, $fs notifications toggleDnd

# Stay Awake is the idle inhibitor: on means the screensaver and the idle
# timeout never fire.
bind = SUPER CTRL, I, exec, $fs screensaver stayAwakeToggle
bind = SUPER CTRL, N, exec, $fs nightlight toggle
# Collapses the bar's chevron group rather than the whole strip; the shell
# has no verb for hiding the bar itself.
bind = SUPER SHIFT, Space, exec, $fs bar chevron toggle
bind = SUPER CTRL, L, exec, $fs lock lock

# The window switcher (off with `switcher.enabled: false` in settings.json,
# which answers these with an error string). Alt+Tab opens the
# card with the cursor on the window you came from and walks the row from
# there, and the commit is bound to the RELEASE of the modifier, which is
# what makes a held Alt feel like Alt+Tab anywhere else. A release bind takes
# the modifier as a keysym rather than as a modifier (`Alt_L`), so the bind
# fires on every Alt release, switcher open or not; `switcher commit` with
# nothing open is a no-op that says so.
#
# `bindrt`, not `bindr`. Hyprland shadows a bind whose key is held down while
# another bind fires (`CKeybindManager::shadowKeybinds`), and nothing lifts
# that until the key is up, which is one event too late: holding Alt and
# pressing Tab shadows the Alt release bind, so a plain `bindr` fires on a
# bare Alt tap and never after an Alt+Tab, which is the one time it is wanted
# (owner, 2026-09-18). `t` is the transparent flag, and a transparent bind is
# the only kind `shadowKeybinds` skips. The mods stay on: Hyprland emits the
# key event before it updates its xkb state (`devices/Keyboard.cpp`), so ALT
# is still held as far as the bind table is concerned when Alt_L comes up.
#
# Alt_R is bound beside it for a right-hand Alt; on a layout where that key
# is AltGr it carries a different modifier and simply never matches. Escape
# and Enter still cancel and commit from the card's own keyboard.
bind = ALT, Tab, exec, $fs switcher next
bind = ALT SHIFT, Tab, exec, $fs switcher prev
bindrt = ALT, Alt_L, exec, $fs switcher commit
bindrt = ALT, Alt_R, exec, $fs switcher commit

# `screenshot pick` is the route with the toolbar, keyboard window selection
# and the hand-off to recording. `screenshot region` is the plain slurp path
# and looks identical from the outside, which is how it gets bound here by
# mistake (ScreenshotIpc.qml's header).
bind = , Print, exec, $fs screenshot pick smart default
bind = SUPER CTRL, Print, exec, $fs capture text
bind = ALT, Print, exec, $fs record toggle screen none

# MEDIA
# The hardware key changes the value and the shell is told to show it: the
# OSD reads brightness on demand and has no signal of its own to hook, and
# volume is shown here for the same reason even though a sink change would
# also surface it. `l` keeps these live while the screen is locked, `e`
# repeats them on hold.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && $fs osd volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && $fs osd volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && $fs osd volume
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+ && $fs osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && $fs osd brightness
bindl = , XF86AudioPlay, exec, $fs media playPause
bindl = , XF86AudioPause, exec, $fs media playPause
bindl = , XF86AudioNext, exec, $fs media next
bindl = , XF86AudioPrev, exec, $fs media previous

# CLIPBOARD
bind = SUPER CTRL, V, exec, $fs menu summon clipboard
